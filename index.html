<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lokaler MP3 Musik-Player">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Musik Garde">
    
    <title>Musik Garde - MP3 Player</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a2e' width='192' height='192'/><text x='50%' y='50%' font-size='80' fill='%23e0e0e0' text-anchor='middle' dominant-baseline='central'>♪</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a2e' width='192' height='192'/><text x='50%' y='50%' font-size='80' fill='%23e0e0e0' text-anchor='middle' dominant-baseline='central'>♪</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <svg class="club-logo" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Shield body -->
                    <path d="M 20 30 L 80 30 L 80 65 Q 80 90 50 105 Q 20 90 20 65 Z" 
                          fill="#1a3a52" stroke="#000" stroke-width="2"/>
                    
                    <!-- Shield interior -->
                    <path d="M 25 35 L 75 35 L 75 65 Q 75 85 50 97 Q 25 85 25 65 Z" 
                          fill="#2563a8"/>
                    
                    <!-- White lion silhouette -->
                    <g transform="translate(50, 58)">
                        <circle cx="0" cy="-8" r="7" fill="white"/>
                        <ellipse cx="0" cy="3" rx="8" ry="9" fill="white"/>
                        <!-- Mane -->
                        <path d="M -10 -5 L -8 -12 M 10 -5 L 8 -12" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </g>
                    
                    <!-- Diagonal stripe -->
                    <line x1="35" y1="45" x2="65" y2="75" stroke="#000" stroke-width="2"/>
                    
                    <!-- Text banner -->
                    <rect x="22" y="80" width="56" height="20" fill="#2563a8" stroke="#000" stroke-width="1"/>
                    <text x="50" y="92" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
                          fill="white" text-anchor="middle">VILSECK</text>
                </svg>
                <h1>Musik Garde</h1>
            </div>
            <p class="subtitle">Lokaler MP3 Player</p>
        </header>

        <main>
            <!-- File Import & Autoplay Section (one line) -->
            <section class="import-autoplay-section">
                <input type="file" id="fileInput" multiple accept=".mp3,audio/mpeg" style="display: none;">
                <button class="btn btn-primary" id="selectFilesBtn">
                    📁 Musik importieren
                </button>
                <p class="file-count" id="fileCount"></p>
                
                <label class="autoplay-label">
                    <input type="checkbox" id="autoplayToggle" checked>
                    <span class="toggle-switch"></span>
                    <span class="toggle-label">Autoplay</span>
                </label>
            </section>

            <!-- Now Playing Section -->
            <section class="now-playing">
                <div class="now-playing-content">
                    <div class="song-info">
                        <h2 id="currentTitle">Keine Musik geladen</h2>
                        <p id="currentFilename" class="filename"></p>
                        <div class="time-display">
                            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                        </div>
                    </div>
                    <div class="album-art-small">
                        <div class="album-placeholder">♪</div>
                    </div>
                </div>
            </section>

            <!-- Progress Bar -->
            <div class="progress-container">
                <input type="range" id="progressBar" min="0" max="100" value="0" class="progress-bar">
            </div>

            <!-- Playback Controls -->
            <section class="controls">
                <button class="btn btn-prev" id="prevBtn" title="Zurück">⏮️</button>
                <button class="btn btn-play" id="playBtn" title="Abspielen">▶️</button>
                <button class="btn btn-pause" id="pauseBtn" title="Pausieren">⏸️</button>
                <button class="btn btn-stop" id="stopBtn" title="Stopp">⏹️</button>
                <button class="btn btn-next" id="nextBtn" title="Weiter">⏭️</button>
            </section>

            <!-- Volume Control -->
            <section class="volume-section">
                <button class="btn btn-mute" id="muteBtn" title="Stummschalten">🔊</button>
                <input type="range" id="volumeSlider" min="0" max="100" value="70" class="volume-slider">
                <span id="volumeValue">70%</span>
            </section>

            <!-- Playlist Section -->
            <section class="playlist-section">
                <h3>Playlist</h3>
                <div id="playlist" class="playlist">
                    <p class="empty-message">Keine Dateien importiert</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer"></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
